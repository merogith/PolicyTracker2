<path d="M865 775.0 L815 775.0" stroke="#587b90" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M455 775.0 L405 775.0" stroke="#587b90" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<text x="45" y="917" font-family="Arial" font-size="16" fill="#536c7c">MODEL ALLOWLIST: prompt + enabled vocabulary + strict schema + authorized source / record units only.</text>
<text x="45" y="944" font-family="Arial" font-size="16" fill="#536c7c">No team guides, archives, previous scores, unrelated files or arbitrary folder scans enter model context.</text>
<text x="45" y="971" font-family="Arial" font-size="16" fill="#536c7c">One country / two shared request slots. Usage ledger + resume. Stale jobs cannot replace newer snapshots.</text>
